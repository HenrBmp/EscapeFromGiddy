<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/styles/style.css" type="text/css" />
        <link rel="stylesheet" href="/styles/game.css" type="text/css" />
        <link rel="stylesheet" href="/styles/popUp.css" type="text/css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Sedgwick+Ave+Display&display=swap"
            rel="stylesheet"
        />
        <title>Game</title>
    </head>
    <body>
        <div id="root">
            <div id="game">
                <canvas>
                    <img id="gustin" src="/media/gustin-piper.png" hidden />
                    <img id="giddyNormal" src="/media/giddy-normal.png" hidden />
                    <img id="giddyRage" src="/media/giddy-rage.png" hidden />
                </canvas>
            </div>
        </div>
        <div id="contagem"></div>
        <div id="sobreposicaoCarregamento">
            <p id="textoCarregamento">Carregando</p>
        </div>
        <template id="popUpTemplate">
            <div id="popUpContainer">
                <div id="popUp">
                    <h1 id="titulo"></h1>
                    <h2 id="mensagemPontuacao"></h2>
                    <a href="/game" id="rejogarButton" type="submit"> Jogar novamente </a>
                    <a href="/" id="sairButton" type="submit">Sair</a>
                </div>
            </div>
        </template>
        <script src="scripts/game/index.js" type="module"></script>
    </body>
</html>
