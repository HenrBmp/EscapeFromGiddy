<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/styles/style.css" type="text/css" />
        <link rel="stylesheet" href="/styles/home.css" type="text/css" />
        <link rel="stylesheet" href="/styles/animations.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Sedgwick+Ave+Display&display=swap"
            rel="stylesheet"
        />
        <title>Home</title>
    </head>
    <body>
        <video id="homeBackground" height="100%" autoplay loop>
            <source src="media/home-page-video.webm" type="video/webm" />
        </video>

        <div id="homeOverlays">
            <header id="homeHead">
                <div id="homeTitulo" class="sedgwick">
                    <span>Escape</span>
                    <span>From</span>
                    <span>Giddy</span>
                </div>

                <div id="homeInfos">
                    <p>Olá <span id="username">Jogador</span></p>
                    <p>Recorde atual: <span id="recordeAtual">0</span></p>
                </div>
            </header>

            <div id="homeBotoes">
                <a href="/game" id="botaoIniciarJogo" class="botao-home-page">
                    Jogar
                </a>
                <a href="/rank" id="botaoVerRank" class="botao-home-page">
                    Ranking
                </a>
            </div>
        </div>
    </body>
</html>
